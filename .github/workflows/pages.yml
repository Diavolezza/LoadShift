# Builds the web app (Kotlin/Wasm) on every push to main and publishes it on GitHub Pages.
name: Web app on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the web app
        # Kotlin/Wasm for most browsers, Kotlin/JS for Safari (index.html chooses); both in one folder.
        run: |
          ./gradlew :composeApp:wasmJsBrowserDistribution :composeApp:jsBrowserDistribution --no-daemon
          cp -Rn composeApp/build/dist/js/productionExecutable/. composeApp/build/dist/wasmJs/productionExecutable/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: composeApp/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
