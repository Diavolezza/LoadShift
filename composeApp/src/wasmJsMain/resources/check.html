<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Shift – Browser check</title>
    <style>body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #F2F5F2; color: #1F2A26; padding: 20px; font-size: 17px; }
        td { padding: 4px 8px; vertical-align: top; border-bottom: 1px solid #DCE5E0; }</style>
</head>
<body>
<h1>Load Shift – Browser check</h1>
<p>If you can read this, the page itself loads. · Wenn du das lesen kannst, lädt die Seite selbst.</p>
<table id="t"><tr><td>JavaScript</td><td>no / nein</td></tr></table>
<script>
    var rows = [];
    function add(k, v) { rows.push("<tr><td>" + k + "</td><td>" + String(v).replace(/[<>&]/g, "") + "</td></tr>"); }
    add("JavaScript", "yes / ja");
    add("User agent", navigator.userAgent);
    add("Screen", screen.width + " × " + screen.height + " · window " + innerWidth + " × " + innerHeight + " · ratio " + devicePixelRatio);
    add("WebAssembly", typeof WebAssembly === "object");
    try { add("WebAssembly GC", WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 3, 1, 95, 0]))); } catch (e) { add("WebAssembly GC", "error " + e); }
    try { var c = document.createElement("canvas"); add("WebGL 2", !!c.getContext("webgl2")); } catch (e) { add("WebGL 2", "error " + e); }
    try { localStorage.setItem("loadshift.check", "1"); add("localStorage", localStorage.getItem("loadshift.check") === "1"); } catch (e) { add("localStorage", "error " + e); }
    document.getElementById("t").innerHTML = rows.join("");
</script>
</body>
</html>
