<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load Shift – a simulation game for teaching Green IT</title>
    <meta name="description" content="A simulation game for teaching Green IT: 28 scenarios in three tracks – operations, engineering and the application portfolio. In the browser, in English and German, open source.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Load Shift – a simulation game for teaching Green IT">
    <meta property="og:description" content="28 scenarios from the data center to the code to the application portfolio. In the browser, in English and German, open source.">
    <meta property="og:url" content="https://diavolezza.github.io/LoadShift/">
    <meta property="og:image" content="https://diavolezza.github.io/LoadShift/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #F2F5F2; }
        #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #1F2A26; text-align: center; padding: 24px; box-sizing: border-box;
            z-index: 1000; background: #F2F5F2; }
        #loading h1 { font-size: 40px; margin: 0 0 12px; }
        #loading a { color: #1E8E68; font-weight: 600; }
        #loading p { font-size: 17px; color: #4C5B55; max-width: 520px; line-height: 1.5; margin: 6px 0; }
        #loading .bar { width: 220px; height: 4px; background: #DCE5E0; border-radius: 2px; overflow: hidden; margin-top: 18px; }
        #loading .bar div { width: 40%; height: 100%; background: #1E8E68; animation: slide 1.2s ease-in-out infinite; }
        @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
    <script>
        // As before 1.0: the body stays empty for the app, and loadshift.js comes from a plain script tag (with the
        // changes of 1.0, Safari showed a blank page).
        // This script runs before the body exists: it decides whether to load the app, and builds the message box
        // outside the body (on the html element), where the app does not touch it.
        (function () {
            var params = new URLSearchParams(location.search);
            var de = (params.get("lang") || navigator.language || "").toLowerCase().indexOf("de") === 0;
            var box = document.createElement("div");
            box.id = "loading";
            box.innerHTML = "<h1>Load Shift</h1><p id='loading-text'></p><div class='bar' id='loading-bar'><div></div></div>";
            document.documentElement.appendChild(box);
            var text = box.querySelector("#loading-text");
            var bar = box.querySelector("#loading-bar");
            text.textContent = de ? "Lädt … beim ersten Mal einige Sekunden." : "Loading … the first time takes a few seconds.";
            function show(html) {
                box.style.display = "flex";
                bar.style.display = "none";
                text.innerHTML = html;
            }
            // Phones: too little room for the charts and the controls at once.
            if (Math.min(screen.width, screen.height) < 600 && !params.has("anyway")) {
                params.set("anyway", "");
                var url = location.pathname + "?" + params.toString().replace("anyway=", "anyway");
                show(de
                    ? "Load Shift braucht einen größeren Bildschirm: ein Tablet oder einen Computer, mindestens etwa 1000 × 600 Pixel. Auf einem Smartphone ist zu wenig Platz für die Grafiken und die Steuerung zugleich.<br><br><a href='" + url + "'>Trotzdem öffnen</a>"
                    : "Load Shift needs a larger screen: a tablet or a computer, at least about 1000 × 600 pixels. A phone has too little room for the charts and the controls at once.<br><br><a href='" + url + "'>Open anyway</a>");
                return;
            }
            function tooOld() {
                show(de
                    ? "Dieser Browser kann Load Shift nicht ausführen: Es braucht WebAssembly mit Garbage Collection.<br>Aktuelle Versionen von Chrome, Edge, Firefox und Safari (ab 18.2) können das."
                    : "This browser cannot run Load Shift: it needs WebAssembly with garbage collection.<br>Current versions of Chrome, Edge, Firefox and Safari (18.2 or later) can.");
            }
            // A module with one struct type validates only where WebAssembly GC is supported.
            var gc = typeof WebAssembly === "object" &&
                WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 3, 1, 95, 0]));
            if (!gc) { tooOld(); return; }
            // Any error while starting, or in the first seconds after, shows up here instead of a blank page.
            var readyAt = 0, broken = false;
            function failed(detail) {
                if (readyAt && Date.now() - readyAt > 10000) return;
                broken = true;
                var safe = String(detail).replace(/[<>&]/g, "");
                show(de
                    ? "Load Shift konnte nicht starten. Bitte melde das mit Gerät und Browser-Version unter github.com/Diavolezza/LoadShift/issues.<br><br>Fehler: " + safe
                    : "Load Shift could not start. Please report it with your device and browser version at github.com/Diavolezza/LoadShift/issues.<br><br>Error: " + safe);
            }
            window.addEventListener("error", function (e) { if (e.message) failed(e.message); });
            window.addEventListener("unhandledrejection", function (e) { failed(e.reason && (e.reason.message || e.reason)); });
            // Called by the app once it runs (main.kt); the loading screen goes after its first frames.
            window.loadShiftStarted = function () {
                window.loadShiftRunning = true;
                setTimeout(function () { readyAt = Date.now(); if (!broken) box.style.display = "none"; }, 800);
            };
            // The same plain script tag as before 1.0, written while the head is parsed.
            document.write('<script type="application/javascript" src="loadshift.js"><\/script>');
        })();
    </script>
</head>
<body>
</body>
</html>
